name: Publish Maven Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build JAR & Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Compile & Run Verification Suite
        run: |
          mkdir -p build/classes/main build/classes/test
          javac -encoding UTF-8 --release 17 -d build/classes/main src/main/java/io/ipscope/sdk/*.java
          javac -encoding UTF-8 --release 17 -cp build/classes/main -d build/classes/test src/test/java/io/ipscope/sdk/*.java
          java -cp build/classes/main:build/classes/test io.ipscope.sdk.IpScopeClientTest

      - name: Deploy to GitHub Packages Maven Registry
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests
