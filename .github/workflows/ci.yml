name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build & run JUnit suite
        run: mvn -B -ntp verify

      - name: Check runtime has zero dependencies
        run: |
          mvn -B -ntp -q dependency:list -DincludeScope=runtime -DoutputFile=runtime-deps.txt
          if grep -q ':.*:.*:' runtime-deps.txt; then
            echo "Unexpected runtime dependencies:"; cat runtime-deps.txt; exit 1
          fi
